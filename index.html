<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape from Battlefield</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-layer">
        <div id="main-menu">
            <h1>Escape from Battlefield</h1>
            <div class="menu-buttons">
                <button id="start-btn">START GAME</button>
                <button id="editor-btn">MAP EDITOR</button>
            </div>
            <div class="controls-hint">
                <p>WASD: 이동 | Shift: 달리기 | 마우스 좌클릭: 공격</p>
                <p>E: 인벤토리 | F: 상호작용 | R: 재장전 | T: 적재함</p>
                <p>F1 / ~: 연습 모드</p>
            </div>
        </div>

        <div id="map-selection-menu" class="hidden">
            <div class="modal-content" style="min-width: 400px; pointer-events: auto;">
                <h2>맵 선택</h2>
                <div id="map-list">
                    <!-- Maps will be listed here -->
                </div>
                <div class="modal-buttons">
                    <button id="map-back-btn" style="background-color: #e74c3c; color: white; width: 100%; padding: 10px;">뒤로 가기</button>
                </div>
            </div>
        </div>

        <!-- Transport Plane Control Modal -->
        <div id="plane-control-modal" class="hidden">
            <div class="modal-content">
                <h4>수송기 제어</h4>
                <div class="modal-buttons" style="flex-direction: column; gap: 10px;">
                    <button id="plane-takeoff-btn" style="background-color: #3498db; color: white; padding: 15px;">🛫 이륙 (Take Off)</button>
                    <button id="plane-land-btn" style="background-color: #27ae60; color: white; padding: 15px;">🛬 착륙 (Land)</button>
                    <button id="plane-close-btn" style="background-color: #7f8c8d; color: white;">닫기</button>
                </div>
            </div>
        </div>

        <div id="editor-ui" class="hidden">
            <!-- Unit Settings Modal -->
            <div id="unit-settings-modal" class="hidden">
                <div class="modal-content">
                    <h4>유닛 설정</h4>
                    <label>상태: 
                        <select id="unit-command">
                            <option value="GUARD">경계 (Guard)</option>
                            <option value="PATROL">순찰 (Patrol)</option>
                            <option value="SURRENDER">항복 (Surrender)</option>
                        </select>
                    </label>
                    <label>순찰 반경: <input type="number" id="unit-patrol-radius" value="250" step="10"></label>
                    <label>체력 배율: <input type="number" id="unit-health-mult" value="1.0" step="0.1"></label>
                    <label>공격력 배율: <input type="number" id="unit-damage-mult" value="1.0" step="0.1"></label>
                    <label>속도 배율: <input type="number" id="unit-speed-mult" value="1.0" step="0.1"></label>
                    <div class="modal-buttons">
                        <button id="unit-settings-save">저장</button>
                        <button id="unit-settings-cancel">취소</button>
                        <button id="unit-settings-delete" style="background-color: #e74c3c;">삭제</button>
                    </div>
                </div>
            </div>

            <!-- Loot Box Settings Modal -->
            <div id="loot-box-settings-modal" class="hidden">
                <div class="modal-content">
                    <h4>전리품 상자 설정</h4>
                    <div id="loot-table-editor">
                        <div class="loot-entry-header">
                            <span>아이템 ID</span>
                            <span>확률 (%)</span>
                        </div>
                        <div id="loot-entries-list">
                            <!-- Entries will be added here -->
                        </div>
                        <button id="add-loot-entry-btn">+ 항목 추가</button>
                    </div>
                    <div class="modal-buttons">
                        <button id="loot-settings-save">저장</button>
                        <button id="loot-settings-cancel">취소</button>
                    </div>
                </div>
            </div>

            <!-- Item Settings Modal -->
            <div id="item-settings-modal" class="hidden">
                <div class="modal-content">
                    <h4>아이템 설정</h4>
                    <label>수량: <input type="number" id="item-count-input" value="1" min="1" max="999"></label>
                    <div class="modal-buttons">
                        <button id="item-settings-save">저장</button>
                        <button id="item-settings-cancel">취소</button>
                        <button id="item-settings-delete" style="background-color: #e74c3c;">삭제</button>
                    </div>
                </div>
            </div>

            <div id="editor-sidebar">
                <h3>Tools</h3>
                <div id="tool-palette">
                    <button id="tool-pen" class="tool-btn selected" title="펜">🖊️</button>
                    <button id="tool-eraser" class="tool-btn" title="지우개">🧽</button>
                    <button id="tool-fill" class="tool-btn" title="채우기">🫗</button>
                    <div class="tool-group">
                        <button id="tool-shape-main" class="tool-btn" title="도형">⬛</button>
                        <div id="shape-sub-palette" class="hidden">
                            <button id="tool-rect" class="sub-tool-btn" title="직사각형">⬛</button>
                            <button id="tool-circle" class="sub-tool-btn" title="원">⚪</button>
                            <button id="tool-triangle" class="sub-tool-btn" title="삼각형">🔺</button>
                        </div>
                    </div>
                </div>
                <h3>Active Layer</h3>
                <div id="layer-selection-group">
                    <button class="layer-btn active" data-layer="floor">Floor</button>
                    <button class="layer-btn" data-layer="block">Block</button>
                    <button class="layer-btn" data-layer="units">Units</button>
                    <button class="layer-btn" data-layer="items">Items</button>
                </div>
                <h3>Tile Palette</h3>
                <div id="tile-palette"></div>
                <div id="editor-controls">
                    <button id="save-map-btn" style="background-color: #27ae60;">SAVE MAP</button>
                    <button id="export-btn">EXPORT ARRAY</button>
                    <button id="import-btn">IMPORT ARRAY</button>
                    <button id="test-editor-btn">TEST STRUCTURE</button>
                    <button id="clear-editor-btn">CLEAR</button>
                    <button id="exit-editor-btn">EXIT</button>
                </div>
                <textarea id="export-output" placeholder="코드를 여기에 붙여넣고 IMPORT 버튼을 누르세요..."></textarea>
            </div>
        </div>
    </div>
    <style>
        #map-selection-menu {
            pointer-events: auto;
            background: rgba(10, 10, 10, 0.95);
            padding: 40px;
            border: 2px solid #f1c40f;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            z-index: 500;
        }
        .map-select-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            background-color: #34495e;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }
        .map-select-btn:hover { 
            background-color: #f1c40f; 
            color: black;
            transform: scale(1.02);
        }
        .map-header {
            color: #f1c40f;
            margin: 20px 0 10px 0;
            font-weight: bold;
            font-size: 14px;
            text-align: left;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        #map-list { 
            max-height: 400px; 
            overflow-y: auto; 
            margin-bottom: 25px; 
            padding: 10px;
        }
        #map-selection-menu h2 { 
            text-align: center; 
            color: #f1c40f; 
            margin-bottom: 25px; 
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
    <canvas id="gameCanvas"></canvas>
    <script type="module" src="src/core/Game.js"></script>
    <script type="module">
        import Game from './src/core/Game.js';
        window.game = new Game();
    </script>
</body>
</html>
