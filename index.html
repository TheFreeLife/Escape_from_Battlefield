<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape from Battlefield</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-layer">
        <div id="main-menu">
            <h1>Escape from Battlefield</h1>
            <div class="menu-buttons">
                <button id="start-btn">START GAME</button>
                <button id="editor-btn">MAP EDITOR</button>
            </div>
            <div class="controls-hint">
                <p>WASD: 이동 | Shift: 달리기 | 마우스 좌클릭: 공격</p>
                <p>E: 인벤토리 | F: 상호작용 | R: 재장전 | T: 적재함</p>
                <p>F1 / ~: 연습 모드</p>
            </div>
        </div>

        <div id="editor-ui" class="hidden">
            <!-- Unit Settings Modal -->
            <div id="unit-settings-modal" class="hidden">
                <div class="modal-content">
                    <h4>유닛 설정</h4>
                    <label>상태: 
                        <select id="unit-command">
                            <option value="GUARD">경계 (Guard)</option>
                            <option value="PATROL">순찰 (Patrol)</option>
                            <option value="SURRENDER">항복 (Surrender)</option>
                        </select>
                    </label>
                    <label>순찰 반경: <input type="number" id="unit-patrol-radius" value="250" step="10"></label>
                    <label>체력 배율: <input type="number" id="unit-health-mult" value="1.0" step="0.1"></label>
                    <label>공격력 배율: <input type="number" id="unit-damage-mult" value="1.0" step="0.1"></label>
                    <label>속도 배율: <input type="number" id="unit-speed-mult" value="1.0" step="0.1"></label>
                    <div class="modal-buttons">
                        <button id="unit-settings-save">저장</button>
                        <button id="unit-settings-cancel">취소</button>
                        <button id="unit-settings-delete" style="background-color: #e74c3c;">삭제</button>
                    </div>
                </div>
            </div>

            <!-- Loot Box Settings Modal -->
            <div id="loot-box-settings-modal" class="hidden">
                <div class="modal-content">
                    <h4>전리품 상자 설정</h4>
                    <div id="loot-table-editor">
                        <div class="loot-entry-header">
                            <span>아이템 ID</span>
                            <span>확률 (%)</span>
                        </div>
                        <div id="loot-entries-list">
                            <!-- Entries will be added here -->
                        </div>
                        <button id="add-loot-entry-btn">+ 항목 추가</button>
                    </div>
                    <div class="modal-buttons">
                        <button id="loot-settings-save">저장</button>
                        <button id="loot-settings-cancel">취소</button>
                    </div>
                </div>
            </div>

            <div id="editor-sidebar">
                <h3>Tools</h3>
                <div id="tool-palette">
                    <button id="tool-pen" class="tool-btn selected" title="펜">🖊️</button>
                    <button id="tool-eraser" class="tool-btn" title="지우개">🧽</button>
                    <button id="tool-fill" class="tool-btn" title="채우기">🫗</button>
                    <div class="tool-group">
                        <button id="tool-shape-main" class="tool-btn" title="도형">⬛</button>
                        <div id="shape-sub-palette" class="hidden">
                            <button id="tool-rect" class="sub-tool-btn" title="직사각형">⬛</button>
                            <button id="tool-circle" class="sub-tool-btn" title="원">⚪</button>
                            <button id="tool-triangle" class="sub-tool-btn" title="삼각형">🔺</button>
                        </div>
                    </div>
                </div>
                <h3>Active Layer</h3>
                <div id="layer-selection-group">
                    <button class="layer-btn active" data-layer="floor">Floor</button>
                    <button class="layer-btn" data-layer="block">Block</button>
                    <button class="layer-btn" data-layer="units">Units</button>
                    <button class="layer-btn" data-layer="items">Items</button>
                </div>
                <h3>Tile Palette</h3>
                <div id="tile-palette"></div>
                <div id="editor-controls">
                    <button id="export-btn">EXPORT ARRAY</button>
                    <button id="import-btn">IMPORT ARRAY</button>
                    <button id="test-editor-btn">TEST STRUCTURE</button>
                    <button id="clear-editor-btn">CLEAR</button>
                    <button id="exit-editor-btn">EXIT</button>
                </div>
                <textarea id="export-output" placeholder="코드를 여기에 붙여넣고 IMPORT 버튼을 누르세요..."></textarea>
            </div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script type="module" src="src/core/Game.js"></script>
    <script type="module">
        import Game from './src/core/Game.js';
        window.game = new Game();
    </script>
</body>
</html>
